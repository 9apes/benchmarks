name: Bench compare (GitHub-hosted vs 9apes)

# Head-to-head timings for https://9apes.com/benchmarks/.
#
# Both arms run at 4 vCPU. `ubuntu-latest` is 2 vCPU on a private repository
# and 4 vCPU on a public one; this repository is public, so it is paired with
# the 4 vCPU 9apes label. The size is asserted at run time rather than assumed.
#
# The only difference between the two arms is `runs-on`. Sizes are matched, or
# the comparison would be measuring machine size instead of machine speed.
#
# All caching is disabled. A cache hit measures the cache, not the runner, and
# the two platforms cache differently. Every run here is cold on purpose.

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: "Which repetition this is (1, 2 or 3). Run the workflow once per value."
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3"]
      smoke:
        description: "Smoke test only: confirm both labels pick up work, skip the workloads."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  bench:
    name: "${{ matrix.workload }} on ${{ matrix.arm }} (run ${{ inputs.repeat }})"
    runs-on: ${{ matrix.arm == 'github' && 'ubuntu-latest' || '9apes-4vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arm: [github, nineapes]
        workload: [pnpm, go, maven]
    defaults:
      run:
        shell: bash

    steps:
      - name: Record machine
        run: |
          echo "runner arm : ${{ matrix.arm }}"
          echo "workload   : ${{ matrix.workload }}"
          echo "nproc      : $(nproc)"
          echo "mem total  : $(free -g 2>/dev/null | awk '/^Mem:/{print $2" GB"}' || echo unknown)"
          echo "kernel     : $(uname -r)"
          # /tmp is reported separately because it is not always the same
          # filesystem as /, and a build that scratches there can run out of
          # space on a machine whose root disk looks healthy.
          echo "fs /       : $(df -h --output=fstype,avail / | tail -1)"
          echo "fs /tmp    : $(df -h --output=fstype,avail /tmp | tail -1)"

      - name: Check the machine is the size this row expects
        run: |
          set -euo pipefail
          got="$(nproc)"
          if [ "$got" != "4" ]; then
            echo "::error::Got ${got} vCPU, expected 4. Both arms must be the same size."
            echo "::error::ubuntu-latest is 2 vCPU on a private repo and 4 vCPU on a public one;"
            echo "::error::if this repo's visibility changed, re-pair the 9apes label to match."
            exit 1
          fi
          echo "size-matched at ${got} vCPU"

      - name: Smoke test short-circuit
        if: ${{ inputs.smoke }}
        run: echo "Smoke test only — both labels picked up work. Skipping workload."

      - uses: actions/checkout@v4
        if: ${{ !inputs.smoke }}

      # ---------------- pnpm ----------------
      - uses: pnpm/action-setup@v4
        if: ${{ !inputs.smoke && matrix.workload == 'pnpm' }}
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: ${{ !inputs.smoke && matrix.workload == 'pnpm' }}
        with:
          node-version: 22
          # No cache: this benchmark measures the machine, not cache warmth.

      - name: "pnpm install + build"
        if: ${{ !inputs.smoke && matrix.workload == 'pnpm' }}
        working-directory: pnpm-bench
        run: |
          source ../scripts/bench-time.sh
          T=$(now_ms)
          pnpm install --frozen-lockfile
          INSTALL=$(dur_ms "$T")
          B=$(now_ms)
          pnpm run build
          BUILD=$(dur_ms "$B")
          echo "WORKLOAD_MS=$(( INSTALL + BUILD ))" >> "$GITHUB_ENV"
          echo "DETAIL=install ${INSTALL}ms, build ${BUILD}ms" >> "$GITHUB_ENV"

      # ---------------- go ----------------
      - uses: actions/setup-go@v5
        if: ${{ !inputs.smoke && matrix.workload == 'go' }}
        with:
          go-version: "1.23"
          cache: false

      - name: "go download + build"
        if: ${{ !inputs.smoke && matrix.workload == 'go' }}
        working-directory: go-bench
        run: |
          source ../scripts/bench-time.sh
          T=$(now_ms)
          go mod download
          DL=$(dur_ms "$T")
          B=$(now_ms)
          go build -a -trimpath -o /tmp/cache-bench-go ./...
          BUILD=$(dur_ms "$B")
          echo "WORKLOAD_MS=$(( DL + BUILD ))" >> "$GITHUB_ENV"
          echo "DETAIL=download ${DL}ms, build ${BUILD}ms" >> "$GITHUB_ENV"

      # ---------------- maven ----------------
      - uses: actions/setup-java@v4
        if: ${{ !inputs.smoke && matrix.workload == 'maven' }}
        with:
          distribution: temurin
          java-version: "21"
          # No cache input: setup-java defaults to no dependency caching.

      - name: "maven package"
        if: ${{ !inputs.smoke && matrix.workload == 'maven' }}
        working-directory: maven-bench
        run: |
          source ../scripts/bench-time.sh
          T=$(now_ms)
          mvn -B -q package -DskipTests
          echo "WORKLOAD_MS=$(dur_ms "$T")" >> "$GITHUB_ENV"
          echo "DETAIL=mvn package" >> "$GITHUB_ENV"

      # ---------------- report ----------------
      - name: Emit result
        if: ${{ !inputs.smoke }}
        run: |
          # BENCH_RESULT is machine-readable on purpose: the published figures
          # are parsed straight out of these logs rather than transcribed by
          # hand. Keep the shape stable.
          echo "BENCH_RESULT {\"arm\":\"${{ matrix.arm }}\",\"workload\":\"${{ matrix.workload }}\",\"repeat\":\"${{ inputs.repeat }}\",\"ms\":${WORKLOAD_MS},\"nproc\":$(nproc),\"runner\":\"${{ matrix.arm == 'github' && 'ubuntu-latest' || '9apes-4vcpu-ubuntu-2404' }}\",\"sha\":\"${GITHUB_SHA}\"}"
          {
            echo "### ${{ matrix.workload }} on ${{ matrix.arm }} (run ${{ inputs.repeat }})"
            echo ""
            echo "| metric | value |"
            echo "|---|---:|"
            echo "| workload wall-clock | ${WORKLOAD_MS} ms |"
            echo "| detail | ${DETAIL} |"
            echo "| vCPU | $(nproc) |"
          } >> "$GITHUB_STEP_SUMMARY"
